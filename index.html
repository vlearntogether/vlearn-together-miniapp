<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Vlearn Together</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: var(--tg-theme-bg-color, #ffffff);

            color: var(--tg-theme-text-color, #222222);

            min-height: 100vh;
        }


        .container {

            width: 100%;

            max-width: 520px;

            margin: 0 auto;

            padding: 24px 18px 40px;
        }


        .welcome {

            font-size: 17px;

            font-weight: 600;

            margin-bottom: 18px;

            color:
                var(
                    --tg-theme-text-color,
                    #222222
                );
        }


        .brand {

            text-align: center;

            font-size: 32px;

            font-weight: 800;

            color: #1976d2;

            margin-bottom: 10px;
        }


        .intro {

            text-align: center;

            font-size: 17px;

            line-height: 1.5;

            margin-bottom: 28px;

            color:
                var(
                    --tg-theme-text-color,
                    #222222
                );
        }


        .page-title {

            text-align: center;

            font-size: 25px;

            font-weight: 750;

            margin-bottom: 8px;
        }


        .khmer-title {

            text-align: center;

            font-size: 18px;

            margin-bottom: 22px;

            line-height: 1.6;
        }


        .course-button {

            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 17px 16px;

            margin-top: 12px;

            font-size: 17px;

            font-weight: 650;

            text-align: left;

            cursor: pointer;

            background:
                var(
                    --tg-theme-secondary-bg-color,
                    #f1f3f5
                );

            color:
                var(
                    --tg-theme-text-color,
                    #222222
                );

            transition: transform 0.12s ease;
        }


        .course-button:active {

            transform: scale(0.98);
        }


        .level-button {

            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 17px 16px;

            margin-top: 12px;

            font-size: 17px;

            font-weight: 650;

            text-align: left;

            cursor: pointer;

            background:
                var(
                    --tg-theme-secondary-bg-color,
                    #f1f3f5
                );

            color:
                var(
                    --tg-theme-text-color,
                    #222222
                );
        }


        .price-card {

            margin-top: 22px;

            padding: 24px 18px;

            border-radius: 18px;

            background:
                var(
                    --tg-theme-secondary-bg-color,
                    #f1f3f5
                );

            text-align: center;
        }


        .course-name {

            font-size: 23px;

            font-weight: 750;

            margin-bottom: 18px;
        }


        .price {

            font-size: 28px;

            font-weight: 800;

            margin-bottom: 8px;
        }


        .old-price {

            text-decoration: line-through;

            opacity: 0.55;

            margin-right: 7px;

            font-size: 21px;
        }


        .new-price {

            font-size: 28px;

            font-weight: 800;
        }


        .discount {

            margin-top: 14px;

            font-size: 18px;

            font-weight: 700;
        }


        .remark-title {

            margin-top: 25px;

            font-size: 17px;

            font-weight: 700;
        }


        .remark {

            margin-top: 10px;

            padding: 15px;

            border-radius: 12px;

            background:
                var(
                    --tg-theme-bg-color,
                    #ffffff
                );

            border: 1px solid
                var(
                    --tg-theme-hint-color,
                    #999999
                );

            font-size: 22px;

            font-weight: 800;

            letter-spacing: 1px;
        }


        .copy-button {

            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 13px;

            margin-top: 10px;

            font-size: 16px;

            font-weight: 650;

            cursor: pointer;

            background: #e9ecef;

            color: #222222;
        }


        .important {

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background:
                rgba(
                    255,
                    193,
                    7,
                    0.12
                );

            font-size: 15px;

            line-height: 1.55;

            text-align: left;
        }


        .register-button {

            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 17px;

            margin-top: 20px;

            font-size: 17px;

            font-weight: 750;

            cursor: pointer;

            background: #1976d2;

            color: #ffffff;
        }


        .back-button {

            width: 100%;

            border: none;

            background: transparent;

            color: #e53935;

            font-size: 16px;

            font-weight: 650;

            padding: 15px 5px;

            margin-top: 18px;

            cursor: pointer;

        }


        .success {

            margin-top: 20px;

            padding: 16px;

            border-radius: 12px;

            background:
                rgba(
                    46,
                    125,
                    50,
                    0.12
                );

            line-height: 1.5;

            text-align: center;

            font-weight: 650;
        }


        .hidden {

            display: none;
        }


    </style>

</head>


<body>


<div class="container">


    <!-- ================================================== -->
    <!-- HOME PAGE -->
    <!-- ================================================== -->

    <section id="homePage">

        <div
            id="telegram-user"
            class="welcome"
        ></div>


        <div class="brand">
            Vlearn Together
        </div>


        <div class="intro">

            Learn English online with our video courses.

        </div>


        <div class="page-title">
            Choose Your Course
        </div>


        <button
            class="course-button"
            onclick="openMajorCourse('general')"
        >

            General English Programme

            <br>

            <span>
                កម្មវិធីភាសាអង់គ្លេសទូទៅ
            </span>

        </button>


        <button
            class="course-button"
            onclick="openMajorCourse('grammar')"
        >

            English Grammar Course

            <br>

            <span>
                វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស
            </span>

        </button>


        <button
            class="course-button"
            onclick="openMajorCourse('vocabulary')"
        >

            English Vocabulary Course

            <br>

            <span>
                វគ្គវាក្យសព្ទភាសាអង់គ្លេស
            </span>

        </button>

    </section>


    <!-- ================================================== -->
    <!-- LEVEL PAGE -->
    <!-- ================================================== -->

    <section
        id="levelPage"
        class="hidden"
    >

        <div class="brand">
            Vlearn Together
        </div>


        <div
            id="majorTitle"
            class="page-title"
        ></div>


        <div
            id="majorKhmer"
            class="khmer-title"
        ></div>


        <div id="levelButtons"></div>


        <button
            class="back-button"
            onclick="goHome()"
        >

            ← Back to Courses

            <br>

            ត្រលប់ក្រោយ

        </button>

    </section>


    <!-- ================================================== -->
    <!-- COURSE DETAILS PAGE -->
    <!-- ================================================== -->

    <section
        id="coursePage"
        class="hidden"
    >

        <div class="brand">
            Vlearn Together
        </div>


        <div
            id="courseCard"
            class="price-card"
        ></div>


        <button
            class="back-button"
            onclick="goLevels()"
        >

            ← Back to Courses

            <br>

            ត្រលប់ក្រោយ

        </button>

    </section>


</div>


<script>


    // =====================================================
    // TELEGRAM
    // =====================================================

    const tg =
        window.Telegram.WebApp;


    tg.ready();

    tg.expand();


    // =====================================================
    // TELEGRAM USER
    // =====================================================

    const user =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user;


    if (user) {

        document.getElementById(
            "telegram-user"
        ).textContent =
            "👋 Welcome, " +
            (
                user.first_name ||
                "student"
            ) +
            "!";

    }
    else {

        document.getElementById(
            "telegram-user"
        ).textContent =
            "👋 Welcome!";

    }


    // =====================================================
    // COURSE DATA
    // =====================================================

    const courses = {


        // -------------------------------------------------
        // GENERAL ENGLISH
        // -------------------------------------------------

        general: {

            title:
                "General English Programme",

            khmer:
                "កម្មវិធីភាសាអង់គ្លេសទូទៅ",

            levels: [

                {
                    name:
                        "Beginner | Level 1–2",

                    botCourse:
                        "General English | Beginner 1–2",

                    oldPrice:
                        30,

                    price:
                        15,

                    discount:
                        50
                },

                {
                    name:
                        "Elementary | Level 3–4",

                    botCourse:
                        "General English | Elementary 3–4",

                    oldPrice:
                        32,

                    price:
                        16,

                    discount:
                        50
                },

                {
                    name:
                        "Pre-intermediate | Level 5–6",

                    botCourse:
                        "General English | Pre-intermediate 5–6",

                    oldPrice:
                        38,

                    price:
                        19,

                    discount:
                        50
                },

                {
                    name:
                        "Intermediate | Level 7–8",

                    botCourse:
                        "General English | Intermediate 7–8",

                    oldPrice:
                        40,

                    price:
                        20,

                    discount:
                        50
                }

            ]

        },


        // -------------------------------------------------
        // ENGLISH GRAMMAR
        // -------------------------------------------------

        grammar: {

            title:
                "English Grammar Course",

            khmer:
                "វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស",

            levels: [

                {
                    name:
                        "Elementary",

                    botCourse:
                        "English Grammar | Elementary",

                    oldPrice:
                        42,

                    price:
                        25.20,

                    discount:
                        40
                },

                {
                    name:
                        "Intermediate",

                    botCourse:
                        "English Grammar | Intermediate",

                    oldPrice:
                        45,

                    price:
                        27,

                    discount:
                        40
                },

                {
                    name:
                        "Advanced",

                    botCourse:
                        "English Grammar | Advanced",

                    oldPrice:
                        50,

                    price:
                        30,

                    discount:
                        40
                }

            ]

        },


        // -------------------------------------------------
        // ENGLISH VOCABULARY
        // -------------------------------------------------

        vocabulary: {

            title:
                "English Vocabulary Course",

            khmer:
                "វគ្គវាក្យសព្ទភាសាអង់គ្លេស",

            levels: [

                {
                    name:
                        "Elementary",

                    botCourse:
                        "English Vocabulary | Elementary",

                    oldPrice:
                        20,

                    price:
                        10,

                    discount:
                        50
                },

                {
                    name:
                        "Intermediate",

                    botCourse:
                        "English Vocabulary | Intermediate",

                    oldPrice:
                        22,

                    price:
                        11,

                    discount:
                        50
                },

                {
                    name:
                        "Upper-intermediate",

                    botCourse:
                        "English Vocabulary | Upper-intermediate",

                    oldPrice:
                        24,

                    price:
                        12,

                    discount:
                        50
                },

                {
                    name:
                        "Advanced",

                    botCourse:
                        "English Vocabulary | Advanced",

                    oldPrice:
                        26,

                    price:
                        13,

                    discount:
                        50
                }

            ]

        }

    };


    // =====================================================
    // CURRENT COURSE
    // =====================================================

    let currentMajor =
        null;

    let currentLevel =
        null;


    // =====================================================
    // GENERATE REMARK
    // =====================================================

    function generateRemark() {

        const characters =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


        let code = "";


        for (
            let i = 0;
            i < 6;
            i++
        ) {

            code +=
                characters[
                    Math.floor(
                        Math.random() *
                        characters.length
                    )
                ];

        }


        return "VT-" + code;

    }


    // =====================================================
    // OPEN MAJOR COURSE
    // =====================================================

    function openMajorCourse(
        major
    ) {

        currentMajor =
            major;


        const data =
            courses[major];


        document.getElementById(
            "homePage"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "coursePage"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "levelPage"
        ).classList.remove(
            "hidden"
        );


        document.getElementById(
            "majorTitle"
        ).textContent =
            data.title;


        document.getElementById(
            "majorKhmer"
        ).textContent =
            data.khmer;


        const levelContainer =
            document.getElementById(
                "levelButtons"
            );


        levelContainer.innerHTML =
            "";


        data.levels.forEach(
            (
                level,
                index
            ) => {


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "level-button";


                button.textContent =
                    level.name;


                button.onclick =
                    function() {

                        openCourse(
                            index
                        );

                    };


                levelContainer.appendChild(
                    button
                );

            }
        );

    }


    // =====================================================
    // OPEN COURSE DETAILS
    // =====================================================

    function openCourse(
        index
    ) {

        currentLevel =
            courses[
                currentMajor
            ].levels[index];


        document.getElementById(
            "levelPage"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "coursePage"
        ).classList.remove(
            "hidden"
        );


        renderCourse();

    }


    // =====================================================
    // RENDER COURSE
    // =====================================================

    function renderCourse() {

        const course =
            currentLevel;


        const remark =
            generateRemark();


        course.remark =
            remark;


        const card =
            document.getElementById(
                "courseCard"
            );


        card.innerHTML = `

            <div class="course-name">

                ${course.name}

            </div>


            <div class="price">

                <span class="old-price">

                    $${course.oldPrice.toFixed(2)}

                </span>


                <span class="new-price">

                    $${course.price.toFixed(2)}

                </span>

            </div>


            <div class="discount">

                Save ${course.discount}%

                <br>

                សន្សំបាន ${course.discount}%

            </div>


            <div class="remark-title">

                Payment Remark

                <br>

                លេខសម្គាល់ការទូទាត់

            </div>


            <div
                id="remarkText"
                class="remark"
            >

                ${remark}

            </div>


            <button
                class="copy-button"
                onclick="copyRemark()"
            >

                📋 Copy Remark

                <br>

                ចម្លងលេខសម្គាល់

            </button>


            <div class="important">

                ⚠️ <strong>Important:</strong>

                <br><br>

                Copy this exact Payment Remark
                and paste it into the
                <strong>Remark</strong> field
                when making your payment.

                <br><br>

                សូមចម្លងលេខសម្គាល់ការទូទាត់នេះ
                ហើយបិទភ្ជាប់វាទៅក្នុងប្រអប់
                <strong>Remark</strong>
                នៅពេលធ្វើការទូទាត់។

            </div>


            <button
                class="register-button"
                onclick="registerCourse()"
            >

                ✅ Continue Registration

                <br>

                បន្តការចុះឈ្មោះ

            </button>

        `;

    }


    // =====================================================
    // COPY REMARK
    // =====================================================

    async function copyRemark() {

        if (!currentLevel) {

            return;

        }


        try {

            await navigator.clipboard.writeText(
                currentLevel.remark
            );


            tg.showPopup({

                title:
                    "Copied",

                message:
                    "Payment Remark copied successfully.",

                buttons: [
                    {
                        type:
                            "ok"
                    }
                ]

            });

        }
        catch (error) {

            alert(
                "Payment Remark: " +
                currentLevel.remark
            );

        }

    }


    // =====================================================
    // SEND REGISTRATION TO BOT
    // =====================================================

    function registerCourse() {

        if (!currentLevel) {

            return;

        }


        const registration = {

            remark:
                currentLevel.remark,

            course:
                currentLevel.botCourse,

            price:
                currentLevel.price,

            discount:
                currentLevel.discount

        };


        const dataString =
            JSON.stringify(
                registration
            );


        console.log(
            "===================================="
        );

        console.log(
            "SENDING REGISTRATION TO BOT"
        );

        console.log(
            "Registration:",
            registration
        );

        console.log(
            "JSON:",
            dataString
        );


        try {

            tg.sendData(
                dataString
            );


            console.log(
                "✅ tg.sendData() was called successfully."
            );


        }
        catch (error) {

            console.log(
                "❌ tg.sendData() ERROR:",
                error
            );


            alert(
                "Registration could not be sent. "
                +
                "Please open the Mini App again."
            );

        }

    }


    // =====================================================
    // BACK TO HOME
    // =====================================================

    function goHome() {

        currentMajor =
            null;

        currentLevel =
            null;


        document.getElementById(
            "levelPage"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "coursePage"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "homePage"
        ).classList.remove(
            "hidden"
        );

    }


    // =====================================================
    // BACK TO LEVELS
    // =====================================================

    function goLevels() {

        if (!currentMajor) {

            goHome();

            return;

        }


        document.getElementById(
            "coursePage"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "levelPage"
        ).classList.remove(
            "hidden"
        );

    }


</script>


</body>

</html>
