<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vlearn Together</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 20px;
            margin: 0;
        }


        .container {
            max-width: 500px;
            margin: auto;
        }


        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }


        h2 {
            margin-top: 25px;
        }


        #telegram-user {
            font-size: 17px;
            margin-bottom: 20px;
        }


        .category-button {
            width: 100%;
            padding: 18px 12px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 14px;
        }


        .category-khmer {
            display: block;
            font-size: 15px;
            font-weight: normal;
            margin-top: 6px;
        }


        .level-button {
            width: 100%;
            padding: 15px 10px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }


        #category-section {
            display: block;
        }


        #level-section {
            display: none;
            margin-top: 25px;
        }


        #course-message {
            margin-top: 20px;
            font-size: 17px;
            font-weight: bold;
        }


        #payment-section {
            display: none;
            margin-top: 25px;
            padding: 22px;
            border-radius: 12px;
            background: #f2f2f2;
        }


        #selected-course {
            font-size: 21px;
            margin-bottom: 15px;
        }


        #price {
            font-size: 20px;
            margin: 12px 0;
        }


        .original-price {
            text-decoration: line-through;
            color: #777;
            margin-right: 8px;
        }


        .discount-price {
            font-weight: bold;
        }


        .saving {
            font-size: 17px;
            font-weight: bold;
            margin: 10px 0 20px;
        }


        .remark-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }


        #remark {
            font-size: 23px;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 1px;
        }


        .copy-button,
        .pay-button,
        .back-button {
            width: 100%;
            padding: 15px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }


        .instruction {
            font-size: 16px;
            line-height: 1.5;
            margin-top: 18px;
        }

    </style>

</head>


<body>


<div class="container">


    <p id="telegram-user"></p>


    <h1>🎓 Vlearn Together</h1>


    <p>
        Learn English online with our video courses.
    </p>


    <!-- ================================================= -->
    <!-- MAIN CATEGORY SECTION -->
    <!-- ================================================= -->

    <div id="category-section">

        <h2>🎓 Choose Your Course</h2>


        <button
            class="category-button"
            onclick="showCategory('general')">

            General English Programme

            <span class="category-khmer">
                កម្មវិធីភាសាអង់គ្លេសទូទៅ
            </span>

        </button>


        <button
            class="category-button"
            onclick="showCategory('grammar')">

            English Grammar Course

            <span class="category-khmer">
                វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស
            </span>

        </button>


        <button
            class="category-button"
            onclick="showCategory('vocabulary')">

            English Vocabulary Course

            <span class="category-khmer">
                វគ្គវាក្យសព្ទភាសាអង់គ្លេស
            </span>

        </button>

    </div>


    <!-- ================================================= -->
    <!-- LEVEL SECTION -->
    <!-- ================================================= -->

    <div id="level-section">

        <h2 id="category-title"></h2>

        <div id="level-buttons"></div>


        <button
            class="back-button"
            onclick="backToCategories()">

            ← Back to Courses

        </button>

    </div>


    <!-- ================================================= -->
    <!-- COURSE MESSAGE -->
    <!-- ================================================= -->

    <div id="course-message"></div>


    <!-- ================================================= -->
    <!-- PAYMENT SECTION -->
    <!-- ================================================= -->

    <div id="payment-section">


        <h3 id="selected-course"></h3>


        <div id="price"></div>


        <div
            id="saving"
            class="saving">
        </div>


        <div class="remark-title">
            🔐 Payment Remark
        </div>


        <div id="remark"></div>


        <button
            class="copy-button"
            onclick="copyRemark()">

            📋 Copy Remark

        </button>


        <p class="instruction">

            ⚠️ <b>Important:</b><br>

            Copy the Payment Remark above and paste it into
            the <b>Remark</b> field when you make your payment.

        </p>


        <button
            id="pay-button"
            class="pay-button"
            onclick="makePayment()">

            💳 Pay via ABA

        </button>


    </div>


</div>


<script>


// ========================================================
// TELEGRAM
// ========================================================

const tg = window.Telegram.WebApp;

tg.ready();

tg.expand();


const user = tg.initDataUnsafe.user;


if (user) {

    document.getElementById("telegram-user").textContent =
        "👋 Welcome, " +
        (user.first_name || "student") +
        "!";

} else {

    document.getElementById("telegram-user").textContent =
        "👋 Welcome to Vlearn Together!";

}


// ========================================================
// COURSE DATA
// ========================================================

const courses = [

    // GENERAL ENGLISH

    {
        category: "general",
        name: "General English | Beginner 1–2",
        original: 30,
        price: 15,
        discount: 50,
        paymentLink: "https://link.payway.com.kh/ABAPAY1e499924g"
    },

    {
        category: "general",
        name: "General English | Elementary 3–4",
        original: 32,
        price: 16,
        discount: 50,
        paymentLink: "https://link.payway.com.kh/ABAPAY12499938C"
    },

    {
        category: "general",
        name: "General English | Pre-intermediate 5–6",
        original: 38,
        price: 19,
        discount: 50,
        paymentLink: "https://link.payway.com.kh/ABAPAYW4499941w"
    },

    {
        category: "general",
        name: "General English | Intermediate 7–8",
        original: 40,
        price: 20,
        discount: 50,
        paymentLink: "https://link.payway.com.kh/ABAPAYoS499945e"
    },


    // ENGLISH GRAMMAR

    {
        category: "grammar",
        name: "English Grammar | Elementary",
        original: 42,
        price: 25.20,
        discount: 40,
        paymentLink: "https://link.payway.com.kh/ABAPAY0V500157n"
    },

    {
        category: "grammar",
        name: "English Grammar | Intermediate",
        original: 45,
        price: 27,
        discount: 40,
        paymentLink: "https://link.payway.com.kh/ABAPAYqL500160G"
    },

    {
        category: "grammar",
        name: "English Grammar | Advanced",
        original: 50,
        price: 30,
        discount: 40,
        paymentLink: "https://link.payway.com.kh/ABAPAYKr500161M"
    },


    // ENGLISH VOCABULARY

    {
        category: "vocabulary",
        name: "English Vocabulary | Elementary",
        original: 20,
        price: 10,
        discount: 50,
        paymentLink: "https://link.payway.com.kh/ABAPAYHH5001622"
    },

    {
        category: "vocabulary",
        name: "English Vocabulary | Intermediate",
        original: 22,
        price: 11,
        discount: 50,
        paymentLink: "https://link.payway.com.kh/ABAPAYi3500163U"
    },

    {
        category: "vocabulary",
        name: "English Vocabulary | Upper-intermediate",
        original: 24,
        price: 12,
        discount: 50,
        paymentLink: "https://link.payway.com.kh/ABAPAY1u500164h"
    },

    {
        category: "vocabulary",
        name: "English Vocabulary | Advanced",
        original: 26,
        price: 13,
        discount: 50,
        paymentLink: "https://link.payway.com.kh/ABAPAYrH500165p"
    }

];


// ========================================================
// VARIABLES
// ========================================================

let paymentRemark = "";

let selectedCourse = null;


// ========================================================
// GENERATE VT REMARK
// ========================================================

function generateRemark() {

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    const array = new Uint32Array(6);

    crypto.getRandomValues(array);


    for (let i = 0; i < 6; i++) {

        code +=
            characters[array[i] % characters.length];

    }


    return "VT-" + code;
}


// ========================================================
// SHOW CATEGORY
// ========================================================

function showCategory(category) {


    document.getElementById(
        "category-section"
    ).style.display = "none";


    document.getElementById(
        "level-section"
    ).style.display = "block";


    document.getElementById(
        "payment-section"
    ).style.display = "none";


    document.getElementById(
        "course-message"
    ).textContent = "";


    const levelButtons =
        document.getElementById("level-buttons");


    levelButtons.innerHTML = "";


    let title = "";


    if (category === "general") {

        title = "General English Programme";

    }

    else if (category === "grammar") {

        title = "English Grammar Course";

    }

    else if (category === "vocabulary") {

        title = "English Vocabulary Course";

    }


    document.getElementById(
        "category-title"
    ).textContent = title;


    courses
        .filter(course => course.category === category)
        .forEach(course => {


            const index =
                courses.indexOf(course);


            const button =
                document.createElement("button");


            button.className =
                "level-button";


            button.textContent =
                course.name.replace(
                    title + " | ",
                    ""
                );


            button.onclick =
                function() {

                    showCourse(index);

                };


            levelButtons.appendChild(button);

        });

}


// ========================================================
// BACK TO CATEGORY
// ========================================================

function backToCategories() {

    document.getElementById(
        "category-section"
    ).style.display = "block";


    document.getElementById(
        "level-section"
    ).style.display = "none";


    document.getElementById(
        "payment-section"
    ).style.display = "none";


    document.getElementById(
        "course-message"
    ).textContent = "";

}


// ========================================================
// SHOW COURSE
// ========================================================

function showCourse(index) {


    selectedCourse =
        courses[index];


    paymentRemark =
        generateRemark();


    document.getElementById(
        "course-message"
    ).textContent =
        "You selected: " +
        selectedCourse.name;


    document.getElementById(
        "selected-course"
    ).textContent =
        "📚 " +
        selectedCourse.name;


    document.getElementById(
        "price"
    ).innerHTML =

        '<span class="original-price">$' +

        selectedCourse.original.toFixed(2) +

        '</span> → ' +

        '<span class="discount-price">$' +

        selectedCourse.price.toFixed(2) +

        '</span>';


    document.getElementById(
        "saving"
    ).textContent =
        "🏷️ Save " +
        selectedCourse.discount +
        "%";


    document.getElementById(
        "remark"
    ).textContent =
        paymentRemark;


    document.getElementById(
        "pay-button"
    ).textContent =
        "💳 Pay $" +
        selectedCourse.price.toFixed(2) +
        " via ABA";


    document.getElementById(
        "payment-section"
    ).style.display =
        "block";

}


// ========================================================
// COPY REMARK
// ========================================================

async function copyRemark() {


    try {

        await navigator.clipboard.writeText(
            paymentRemark
        );


        alert(
            "✅ Payment Remark copied!\n\n" +
            paymentRemark +
            "\n\n" +
            "Please paste it into the Remark field when you make your payment."
        );

    }

    catch (error) {

        alert(
            "Please copy this Payment Remark manually:\n\n" +
            paymentRemark
        );

    }

}


// ========================================================
// PAY VIA ABA
// ========================================================

function makePayment() {


    if (!selectedCourse) {

        alert(
            "Please select a course first."
        );

        return;

    }


    if (!paymentRemark) {

        alert(
            "Payment Remark is missing."
        );

        return;

    }


    window.open(
        selectedCourse.paymentLink,
        "_blank"
    );

}


</script>


</body>

</html>
