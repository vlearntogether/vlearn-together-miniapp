<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vlearn Together</title>


    <style>

        /* ==================================================
           TELEGRAM THEME
        ================================================== */

        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #777777);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f2);
        }


        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                "Noto Sans Khmer",
                sans-serif;

            background-color: var(--bg-color);

            color: var(--text-color);

            text-align: center;

            padding: 25px 18px 35px;

            margin: 0;

            min-height: 100vh;

        }


        .container {

            max-width: 500px;

            margin: 0 auto;

        }


        /* ==================================================
           HEADER
        ================================================== */

        #telegram-user {

            font-size: 16px;

            margin: 5px 0 20px;

            color: var(--text-color);

        }


        .brand {

            font-size: 32px;

            font-weight: 700;

            color: #1683e6;

            margin: 5px 0 10px;

        }


        .description {

            font-size: 17px;

            line-height: 1.5;

            color: var(--text-color);

            margin-bottom: 25px;

        }


        /* ==================================================
           PAGE TITLES
        ================================================== */

        .page-title {

            font-size: 24px;

            font-weight: 700;

            margin: 25px 0 5px;

        }


        .khmer-title {

            font-size: 16px;

            line-height: 1.5;

            color: var(--hint-color);

            margin-bottom: 22px;

        }


        /* ==================================================
           COURSE CARDS
        ================================================== */

        .course-card {

            width: 100%;

            padding: 18px 16px;

            margin-top: 13px;

            border: 1px solid
                rgba(128, 128, 128, 0.25);

            border-radius: 14px;

            background-color: var(--secondary-bg);

            color: var(--text-color);

            cursor: pointer;

            text-align: center;

            transition: transform 0.15s ease;

        }


        .course-card:active {

            transform: scale(0.98);

        }


        .course-name {

            font-size: 18px;

            font-weight: 700;

            line-height: 1.4;

        }


        .course-khmer {

            display: block;

            font-size: 15px;

            font-weight: 400;

            line-height: 1.5;

            margin-top: 5px;

            color: var(--hint-color);

        }


        /* ==================================================
           LEVEL BUTTONS
        ================================================== */

        .level-card {

            width: 100%;

            padding: 17px 15px;

            margin-top: 12px;

            border: 1px solid
                rgba(128, 128, 128, 0.25);

            border-radius: 13px;

            background-color: var(--secondary-bg);

            color: var(--text-color);

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;

            transition: transform 0.15s ease;

        }


        .level-card:active {

            transform: scale(0.98);

        }


        /* ==================================================
           COURSE DETAILS PAGE
        ================================================== */

        #selected-course {

            font-size: 23px;

            font-weight: 700;

            line-height: 1.4;

            margin: 25px 0 18px;

        }


        .price {

            font-size: 22px;

            margin: 12px 0;

        }


        .original-price {

            text-decoration: line-through;

            color: var(--hint-color);

            margin-right: 7px;

        }


        .discount-price {

            font-weight: 700;

        }


        .saving {

            font-size: 17px;

            font-weight: 700;

            margin: 18px 0 25px;

        }


        /* ==================================================
           PAYMENT REMARK
        ================================================== */

        .payment-box {

            margin-top: 20px;

            padding: 20px 16px;

            border-radius: 14px;

            background-color: var(--secondary-bg);

        }


        .payment-title {

            font-size: 18px;

            font-weight: 700;

            line-height: 1.5;

            margin-bottom: 12px;

        }


        #remark {

            font-size: 24px;

            font-weight: 700;

            letter-spacing: 1px;

            margin: 15px 0;

        }


        /* ==================================================
           INSTRUCTION
        ================================================== */

        .important {

            text-align: left;

            font-size: 16px;

            line-height: 1.6;

            margin: 20px 0;

        }


        .important-title {

            font-weight: 700;

        }


        /* ==================================================
           BUTTONS
        ================================================== */

        .primary-button {

            width: 100%;

            padding: 15px;

            margin-top: 12px;

            border: none;

            border-radius: 11px;

            background-color: var(--button-color);

            color: var(--button-text-color);

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

        }


        .copy-button {

            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 11px;

            background-color: var(--button-color);

            color: var(--button-text-color);

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

        }


        .back-button {

            width: 100%;

            padding: 13px;

            margin-top: 25px;

            border: none;

            background: transparent;

            color: #e53935;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

        }


        /* ==================================================
           STATUS
        ================================================== */

        #status-message {

            margin-top: 18px;

            font-size: 16px;

            font-weight: 700;

            line-height: 1.5;

        }


        /* ==================================================
           HIDDEN PAGES
        ================================================== */

        .page {

            display: none;

        }


        .page.active {

            display: block;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==================================================
         WELCOME HEADER
    ================================================== -->

    <p id="telegram-user"></p>

    <div class="brand">
        Vlearn Together
    </div>

    <p class="description">
        Learn English online with our video courses.
    </p>


    <!-- ==================================================
         PAGE 1
         MAJOR COURSES
    ================================================== -->

    <div
        id="page-categories"
        class="page active"
    >

        <div class="page-title">
            Choose Your Course
        </div>


        <!-- GENERAL ENGLISH -->

        <button
            class="course-card"
            onclick="showCategory('general')"
        >

            <span class="course-name">
                General English Programme
            </span>

            <span class="course-khmer">
                កម្មវិធីភាសាអង់គ្លេសទូទៅ
            </span>

        </button>


        <!-- GRAMMAR -->

        <button
            class="course-card"
            onclick="showCategory('grammar')"
        >

            <span class="course-name">
                English Grammar Course
            </span>

            <span class="course-khmer">
                វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស
            </span>

        </button>


        <!-- VOCABULARY -->

        <button
            class="course-card"
            onclick="showCategory('vocabulary')"
        >

            <span class="course-name">
                English Vocabulary Course
            </span>

            <span class="course-khmer">
                វគ្គវាក្យសព្ទភាសាអង់គ្លេស
            </span>

        </button>

    </div>


    <!-- ==================================================
         PAGE 2
         COURSE LEVELS
    ================================================== -->

    <div
        id="page-levels"
        class="page"
    >

        <div
            id="level-title"
            class="page-title"
        ></div>


        <div
            id="level-khmer"
            class="khmer-title"
        ></div>


        <div id="level-list"></div>


        <button
            class="back-button"
            onclick="showCategories()"
        >

            ← Back to Courses

            <br>

            ត្រលប់ក្រោយ

        </button>

    </div>


    <!-- ==================================================
         PAGE 3
         COURSE DETAILS
    ================================================== -->

    <div
        id="page-details"
        class="page"
    >


        <div id="selected-course"></div>


        <div
            id="price"
            class="price"
        ></div>


        <div
            id="saving"
            class="saving"
        ></div>


        <!-- PAYMENT BOX -->

        <div class="payment-box">


            <div class="payment-title">
                🔐 លេខសម្គាល់ការទូទាត់
            </div>


            <div id="remark"></div>


            <button
                class="copy-button"
                onclick="copyRemark()"
            >

                📋 ចម្លងលេខសម្គាល់

            </button>


            <div class="important">

                <div class="important-title">
                    ⚠️ សំខាន់៖
                </div>

                សូមចម្លងលេខសម្គាល់ការទូទាត់នេះ
                ឱ្យបានត្រឹមត្រូវ ហើយបិទភ្ជាប់វាទៅក្នុងប្រអប់
                <b>Remark</b> នៅពេលធ្វើការទូទាត់។

            </div>


            <button
                class="primary-button"
                onclick="registerCourse()"
            >

                ✅ បន្តការចុះឈ្មោះ

            </button>


            <div
                id="status-message"
            ></div>


        </div>


        <!-- BACK -->

        <button
            class="back-button"
            onclick="showLevels()"
        >

            ← Back to Courses

            <br>

            ត្រលប់ក្រោយ

        </button>


    </div>


</div>


<script>


// ========================================================
// TELEGRAM WEB APP
// ========================================================

const tg = window.Telegram.WebApp;

tg.ready();

tg.expand();


// ========================================================
// TELEGRAM USER
// ========================================================

const user =
    tg.initDataUnsafe.user;


if (user) {

    const fullName =
        [
            user.first_name,
            user.last_name
        ]
        .filter(Boolean)
        .join(" ");


    document.getElementById(
        "telegram-user"
    ).textContent =
        "👋 Welcome, " +
        (fullName || "student") +
        "!";

}

else {

    document.getElementById(
        "telegram-user"
    ).textContent =
        "👋 Welcome!";

}


// ========================================================
// COURSE DATA
// ========================================================

const courses = [

    // ====================================================
    // GENERAL ENGLISH
    // ====================================================

    {
        category: "general",

        level: "Beginner | Level 1–2",

        detailName:
            "General English | Beginner 1–2",

        khmer:
            "កម្មវិធីភាសាអង់គ្លេសទូទៅ",

        original: 30,

        price: 15,

        discount: 50,

        paymentLink:
            "https://link.payway.com.kh/ABAPAY1e499924g"
    },


    {
        category: "general",

        level: "Elementary | Level 3–4",

        detailName:
            "General English | Elementary 3–4",

        khmer:
            "កម្មវិធីភាសាអង់គ្លេសទូទៅ",

        original: 32,

        price: 16,

        discount: 50,

        paymentLink:
            "https://link.payway.com.kh/ABAPAY12499938C"
    },


    {
        category: "general",

        level:
            "Pre-intermediate | Level 5–6",

        detailName:
            "General English | Pre-intermediate 5–6",

        khmer:
            "កម្មវិធីភាសាអង់គ្លេសទូទៅ",

        original: 38,

        price: 19,

        discount: 50,

        paymentLink:
            "https://link.payway.com.kh/ABAPAYW4499941w"
    },


    {
        category: "general",

        level:
            "Intermediate | Level 7–8",

        detailName:
            "General English | Intermediate 7–8",

        khmer:
            "កម្មវិធីភាសាអង់គ្លេសទូទៅ",

        original: 40,

        price: 20,

        discount: 50,

        paymentLink:
            "https://link.payway.com.kh/ABAPAYoS499945e"
    },


    // ====================================================
    // ENGLISH GRAMMAR
    // ====================================================

    {
        category: "grammar",

        level: "Elementary",

        detailName:
            "English Grammar | Elementary",

        khmer:
            "វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស",

        original: 42,

        price: 25.20,

        discount: 40,

        paymentLink:
            "https://link.payway.com.kh/ABAPAY0V500157n"
    },


    {
        category: "grammar",

        level: "Intermediate",

        detailName:
            "English Grammar | Intermediate",

        khmer:
            "វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស",

        original: 45,

        price: 27,

        discount: 40,

        paymentLink:
            "https://link.payway.com.kh/ABAPAYqL500160G"
    },


    {
        category: "grammar",

        level: "Advanced",

        detailName:
            "English Grammar | Advanced",

        khmer:
            "វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស",

        original: 50,

        price: 30,

        discount: 40,

        paymentLink:
            "https://link.payway.com.kh/ABAPAYKr500161M"
    },


    // ====================================================
    // ENGLISH VOCABULARY
    // ====================================================

    {
        category: "vocabulary",

        level: "Elementary",

        detailName:
            "English Vocabulary | Elementary",

        khmer:
            "វគ្គវាក្យសព្ទភាសាអង់គ្លេស",

        original: 20,

        price: 10,

        discount: 50,

        paymentLink:
            "https://link.payway.com.kh/ABAPAYHH5001622"
    },


    {
        category: "vocabulary",

        level: "Intermediate",

        detailName:
            "English Vocabulary | Intermediate",

        khmer:
            "វគ្គវាក្យសព្ទភាសាអង់គ្លេស",

        original: 22,

        price: 11,

        discount: 50,

        paymentLink:
            "https://link.payway.com.kh/ABAPAYi3500163U"
    },


    {
        category: "vocabulary",

        level:
            "Upper-intermediate",

        detailName:
            "English Vocabulary | Upper-intermediate",

        khmer:
            "វគ្គវាក្យសព្ទភាសាអង់គ្លេស",

        original: 24,

        price: 12,

        discount: 50,

        paymentLink:
            "https://link.payway.com.kh/ABAPAY1u500164h"
    },


    {
        category: "vocabulary",

        level: "Advanced",

        detailName:
            "English Vocabulary | Advanced",

        khmer:
            "វគ្គវាក្យសព្ទភាសាអង់គ្លេស",

        original: 26,

        price: 13,

        discount: 50,

        paymentLink:
            "https://link.payway.com.kh/ABAPAYrH500165p"
    }

];


// ========================================================
// VARIABLES
// ========================================================

let selectedCourse = null;

let paymentRemark = "";

let selectedCategory = "";


// ========================================================
// PAGE MANAGEMENT
// ========================================================

function hideAllPages() {

    document
        .querySelectorAll(".page")
        .forEach(
            page => {
                page.classList.remove(
                    "active"
                );
            }
        );

}


// ========================================================
// SHOW MAJOR COURSES
// ========================================================

function showCategories() {

    hideAllPages();

    document
        .getElementById(
            "page-categories"
        )
        .classList.add(
            "active"
        );

}


// ========================================================
// SHOW LEVEL PAGE
// ========================================================

function showCategory(category) {

    selectedCategory = category;

    hideAllPages();


    document
        .getElementById(
            "page-levels"
        )
        .classList.add(
            "active"
        );


    let title = "";

    let khmer = "";


    if (category === "general") {

        title =
            "General English Programme";

        khmer =
            "កម្មវិធីភាសាអង់គ្លេសទូទៅ";

    }

    else if (category === "grammar") {

        title =
            "English Grammar Course";

        khmer =
            "វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស";

    }

    else if (category === "vocabulary") {

        title =
            "English Vocabulary Course";

        khmer =
            "វគ្គវាក្យសព្ទភាសាអង់គ្លេស";

    }


    document.getElementById(
        "level-title"
    ).textContent =
        title;


    document.getElementById(
        "level-khmer"
    ).textContent =
        khmer;


    const levelList =
        document.getElementById(
            "level-list"
        );


    levelList.innerHTML = "";


    courses
        .filter(
            course =>
                course.category === category
        )
        .forEach(
            course => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "level-card";


                button.textContent =
                    course.level;


                button.onclick =
                    function() {

                        showCourse(
                            courses.indexOf(
                                course
                            )
                        );

                    };


                levelList.appendChild(
                    button
                );

            }
        );

}


// ========================================================
// GENERATE REMARK
// ========================================================

function generateRemark() {

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let code = "";


    const array =
        new Uint32Array(6);


    crypto.getRandomValues(
        array
    );


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        code +=
            characters[
                array[i] %
                characters.length
            ];

    }


    return "VT-" + code;

}


// ========================================================
// SHOW COURSE DETAILS
// ========================================================

function showCourse(index) {

    selectedCourse =
        courses[index];


    paymentRemark =
        generateRemark();


    hideAllPages();


    document
        .getElementById(
            "page-details"
        )
        .classList.add(
            "active"
        );


    document.getElementById(
        "selected-course"
    ).textContent =
        selectedCourse.detailName;


    document.getElementById(
        "price"
    ).innerHTML =

        '<span class="original-price">$' +

        selectedCourse.original.toFixed(2) +

        '</span> → ' +

        '<span class="discount-price">$' +

        selectedCourse.price.toFixed(2) +

        '</span>';


    document.getElementById(
        "saving"
    ).textContent =
        "🏷️ បញ្ចុះតម្លៃ " +
        selectedCourse.discount +
        "%";


    document.getElementById(
        "remark"
    ).textContent =
        paymentRemark;


    document.getElementById(
        "status-message"
    ).textContent = "";

}


// ========================================================
// BACK TO LEVELS
// ========================================================

function showLevels() {

    showCategory(
        selectedCategory
    );

}


// ========================================================
// COPY REMARK
// ========================================================

async function copyRemark() {

    try {

        await navigator.clipboard.writeText(
            paymentRemark
        );


        document.getElementById(
            "status-message"
        ).textContent =
            "✅ លេខសម្គាល់ការទូទាត់ត្រូវបានចម្លង!";


    }

    catch (error) {

        alert(
            "សូមចម្លងលេខសម្គាល់ការទូទាត់ដោយដៃ:\n\n" +
            paymentRemark
        );

    }

}


// ========================================================
// REGISTER COURSE
// ========================================================

function registerCourse() {

    if (!selectedCourse) {

        alert(
            "សូមជ្រើសរើសវគ្គសិក្សាជាមុនសិន។"
        );

        return;

    }


    if (!paymentRemark) {

        alert(
            "លេខសម្គាល់ការទូទាត់មិនមានទេ។"
        );

        return;

    }


    const registrationData = {

        remark:
            paymentRemark,

        course:
            selectedCourse.detailName,

        price:
            selectedCourse.price,

        discount:
            selectedCourse.discount,

        paymentLink:
            selectedCourse.paymentLink

    };


    const dataString =
        JSON.stringify(
            registrationData
        );


    // Send registration to bot

    tg.sendData(
        dataString
    );


    document.getElementById(
        "status-message"
    ).textContent =
        "✅ ការចុះឈ្មោះត្រូវបានផ្ញើដោយជោគជ័យ!";

}


// ========================================================
// END
// ========================================================

</script>


</body>

</html>
