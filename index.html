<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlearn Together</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        .courses button {
            width: 100%;
            padding: 16px 10px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 12px;
        }

        #course-message {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        #payment-section {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #f2f2f2;
        }

        #remark {
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
            letter-spacing: 1px;
        }

        #copy-button {
            width: 100%;
            padding: 15px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <p id="telegram-user"></p>

        <h1>🎓 Vlearn Together</h1>

        <p>
            🇬🇧 Learn English online with our video courses.
        </p>

        <h2>🎓 Choose Your English Course</h2>

        <div class="courses">

            <button onclick="showCourse('Beginner | Level 1–2')">
                📚 Beginner | Level 1–2
            </button>

            <button onclick="showCourse('Elementary | Level 3–4')">
                📚 Elementary | Level 3–4
            </button>

            <button onclick="showCourse('Pre-intermediate | Level 5–6')">
                📚 Pre-intermediate | Level 5–6
            </button>

            <button onclick="showCourse('Intermediate | Level 7–8')">
                📚 Intermediate | Level 7–8
            </button>

        </div>

        <div id="course-message"></div>

        <div id="payment-section">

            <h3 id="selected-course"></h3>

            <p>🔐 Your Payment Remark:</p>

            <div id="remark"></div>

            <button id="copy-button" onclick="copyRemark()">
                📋 Copy Remark
            </button>

            <p>
                ⚠️ Copy this Remark and paste it into the
                Remark field when you make your payment.
            </p>

        </div>

    </div>

    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe.user;

        if (user) {
            document.getElementById("telegram-user").textContent =
                "👋 Welcome, " + (user.first_name || "student") + "!";
        } else {
            document.getElementById("telegram-user").textContent =
                "👋 Welcome to Vlearn Together!";
        }


        let paymentRemark = "";


        function generateRemark() {

            const characters =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            let code = "";

            const array = new Uint32Array(6);

            crypto.getRandomValues(array);

            for (let i = 0; i < 6; i++) {
                code += characters[array[i] % characters.length];
            }

            return "VT-" + code;
        }


        function showCourse(courseName) {

            paymentRemark = generateRemark();

            document.getElementById("course-message").textContent =
                "You selected: " + courseName;

            document.getElementById("selected-course").textContent =
                "📚 " + courseName;

            document.getElementById("remark").textContent =
                paymentRemark;

            document.getElementById("payment-section").style.display =
                "block";
        }


        async function copyRemark() {

            try {

                await navigator.clipboard.writeText(paymentRemark);

                alert(
                    "✅ Remark copied!\n\n" +
                    paymentRemark +
                    "\n\nPlease paste it into the Remark field when you make your payment."
                );

            } catch (error) {

                alert(
                    "Please copy this Remark manually:\n\n" +
                    paymentRemark
                );

            }
        }

    </script>

</body>
</html>
