<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlearn Together</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        button {
            padding: 14px 28px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <p id="telegram-user"></p>

        <h1>🎓 Vlearn Together</h1>

        <p>
            🇬🇧 Learn English online with our video courses.
        </p>

        <p>
            📚 Beginner | Level 1–2<br>
            📚 Elementary | Level 3–4<br>
            📚 Pre-intermediate | Level 5–6<br>
            📚 Intermediate | Level 7–8
        </p>

        <button>
            📚 Explore Courses | ស្វែងរកវគ្គសិក្សា
        </button>

    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe.user;

        if (user) {
            document.getElementById("telegram-user").textContent =
                "👋 Welcome, " + (user.first_name || "student") + "!";
        } else {
            document.getElementById("telegram-user").textContent =
                "👋 Welcome to Vlearn Together!";
        }
    </script>

</body>
</html>
