<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vlearn Together</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            background: var(
                --tg-theme-bg-color,
                #ffffff
            );

            color: var(
                --tg-theme-text-color,
                #222222
            );
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 24px 18px 40px;
        }

        .welcome {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .brand {
            text-align: center;
            color: #1976d2;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .intro {
            text-align: center;
            font-size: 17px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .title {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .khmer {
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .course-button,
        .level-button {
            width: 100%;
            border: none;
            border-radius: 14px;

            padding: 17px 15px;

            margin-top: 12px;

            font-size: 17px;
            font-weight: bold;

            text-align: left;

            background: var(
                --tg-theme-secondary-bg-color,
                #f1f3f5
            );

            color: var(
                --tg-theme-text-color,
                #222222
            );

            cursor: pointer;
        }

        .course-button:active,
        .level-button:active,
        .register-button:active,
        .copy-button:active {
            transform: scale(0.98);
        }

        .details {
            margin-top: 20px;

            padding: 22px 18px;

            border-radius: 18px;

            background: var(
                --tg-theme-secondary-bg-color,
                #f1f3f5
            );

            text-align: center;
        }

        .course-name {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
        }

        .old-price {
            text-decoration: line-through;
            opacity: 0.55;
            font-size: 21px;
            margin-right: 8px;
        }

        .new-price {
            font-size: 29px;
            font-weight: bold;
        }

        .discount {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .remark-title {
            margin-top: 25px;
            font-size: 17px;
            font-weight: bold;
            line-height: 1.6;
        }

        .remark {
            margin-top: 10px;

            padding: 15px;

            border-radius: 12px;

            background: var(
                --tg-theme-bg-color,
                #ffffff
            );

            border: 1px solid #cccccc;

            font-size: 22px;
            font-weight: bold;

            letter-spacing: 1px;
        }

        .copy-button {
            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 13px;

            margin-top: 10px;

            font-size: 16px;
            font-weight: bold;

            background: #e9ecef;

            color: #222222;

            cursor: pointer;
        }

        .important {
            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background: rgba(
                255,
                193,
                7,
                0.12
            );

            font-size: 15px;

            line-height: 1.6;

            text-align: left;
        }

        .register-button {
            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 17px;

            margin-top: 20px;

            font-size: 17px;
            font-weight: bold;

            background: #1976d2;

            color: white;

            cursor: pointer;
        }

        .back-button {
            width: 100%;

            border: none;

            background: transparent;

            color: #e53935;

            font-size: 16px;
            font-weight: bold;

            padding: 16px 5px;

            margin-top: 14px;

            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ================================================= -->
    <!-- HOME -->
    <!-- ================================================= -->

    <div id="homePage">

        <div
            id="telegramUser"
            class="welcome"
        >
            👋 Welcome!
        </div>


        <div class="brand">
            Vlearn Together
        </div>


        <div class="intro">

            Learn English online with our video courses.

        </div>


        <div class="title">
            Choose Your Course
        </div>


        <button
            class="course-button"
            onclick="showMajor('general')"
        >

            General English Programme

            <br>

            កម្មវិធីភាសាអង់គ្លេសទូទៅ

        </button>


        <button
            class="course-button"
            onclick="showMajor('grammar')"
        >

            English Grammar Course

            <br>

            វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស

        </button>


        <button
            class="course-button"
            onclick="showMajor('vocabulary')"
        >

            English Vocabulary Course

            <br>

            វគ្គវាក្យសព្ទភាសាអង់គ្លេស

        </button>

    </div>



    <!-- ================================================= -->
    <!-- LEVEL PAGE -->
    <!-- ================================================= -->

    <div
        id="levelPage"
        class="hidden"
    >

        <div class="brand">
            Vlearn Together
        </div>


        <div
            id="levelTitle"
            class="title"
        ></div>


        <div
            id="levelKhmer"
            class="khmer"
        ></div>


        <div id="levelList"></div>


        <button
            class="back-button"
            onclick="showHome()"
        >

            ← Back to Courses

            <br>

            ត្រលប់ក្រោយ

        </button>

    </div>



    <!-- ================================================= -->
    <!-- COURSE DETAILS -->
    <!-- ================================================= -->

    <div
        id="detailsPage"
        class="hidden"
    >

        <div class="brand">
            Vlearn Together
        </div>


        <div
            id="courseDetails"
            class="details"
        ></div>


        <button
            class="back-button"
            onclick="backToLevels()"
        >

            ← Back to Courses

            <br>

            ត្រលប់ក្រោយ

        </button>

    </div>


</div>



<script>


// =======================================================
// TELEGRAM
// =======================================================

const tg = window.Telegram.WebApp;

tg.ready();

tg.expand();


// =======================================================
// TELEGRAM USER
// =======================================================

const telegramUser =
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user;


if (telegramUser) {

    document.getElementById(
        "telegramUser"
    ).textContent =
        "👋 Welcome, " +
        (
            telegramUser.first_name ||
            "student"
        ) +
        "!";

}


// =======================================================
// COURSE DATA
// =======================================================

const courseData = {


    general: {

        title:
            "General English Programme",

        khmer:
            "កម្មវិធីភាសាអង់គ្លេសទូទៅ",

        courses: [

            {
                level:
                    "Beginner | Level 1–2",

                course:
                    "General English | Beginner 1–2",

                oldPrice:
                    30,

                price:
                    15,

                discount:
                    50,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAY1e499924g"
            },


            {
                level:
                    "Elementary | Level 3–4",

                course:
                    "General English | Elementary 3–4",

                oldPrice:
                    32,

                price:
                    16,

                discount:
                    50,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAY12499938C"
            },


            {
                level:
                    "Pre-intermediate | Level 5–6",

                course:
                    "General English | Pre-intermediate 5–6",

                oldPrice:
                    38,

                price:
                    19,

                discount:
                    50,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAYW4499941w"
            },


            {
                level:
                    "Intermediate | Level 7–8",

                course:
                    "General English | Intermediate 7–8",

                oldPrice:
                    40,

                price:
                    20,

                discount:
                    50,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAYoS499945e"
            }

        ]

    },


    grammar: {

        title:
            "English Grammar Course",

        khmer:
            "វគ្គវេយ្យាករណ៍ភាសាអង់គ្លេស",

        courses: [

            {
                level:
                    "Elementary",

                course:
                    "English Grammar | Elementary",

                oldPrice:
                    42,

                price:
                    25.20,

                discount:
                    40,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAY0V500157n"
            },


            {
                level:
                    "Intermediate",

                course:
                    "English Grammar | Intermediate",

                oldPrice:
                    45,

                price:
                    27,

                discount:
                    40,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAYqL500160G"
            },


            {
                level:
                    "Advanced",

                course:
                    "English Grammar | Advanced",

                oldPrice:
                    50,

                price:
                    30,

                discount:
                    40,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAYKr500161M"
            }

        ]

    },


    vocabulary: {

        title:
            "English Vocabulary Course",

        khmer:
            "វគ្គវាក្យសព្ទភាសាអង់គ្លេស",

        courses: [

            {
                level:
                    "Elementary",

                course:
                    "English Vocabulary | Elementary",

                oldPrice:
                    20,

                price:
                    10,

                discount:
                    50,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAYHH5001622"
            },


            {
                level:
                    "Intermediate",

                course:
                    "English Vocabulary | Intermediate",

                oldPrice:
                    22,

                price:
                    11,

                discount:
                    50,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAYi3500163U"
            },


            {
                level:
                    "Upper-intermediate",

                course:
                    "English Vocabulary | Upper-intermediate",

                oldPrice:
                    24,

                price:
                    12,

                discount:
                    50,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAY1u500164h"
            },


            {
                level:
                    "Advanced",

                course:
                    "English Vocabulary | Advanced",

                oldPrice:
                    26,

                price:
                    13,

                discount:
                    50,

                paymentLink:
                    "https://link.payway.com.kh/ABAPAYrH500165p"
            }

        ]

    }

};


// =======================================================
// CURRENT SELECTION
// =======================================================

let selectedMajor = null;

let selectedCourse = null;


// =======================================================
// GENERATE REMARK
// =======================================================

function generateRemark() {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let result = "";

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        result +=
            characters.charAt(
                Math.floor(
                    Math.random() *
                    characters.length
                )
            );

    }

    return "VT-" + result;

}


// =======================================================
// SHOW MAJOR COURSE
// =======================================================

function showMajor(
    major
) {

    selectedMajor =
        major;


    const data =
        courseData[major];


    document.getElementById(
        "homePage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "detailsPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "levelPage"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "levelTitle"
    ).textContent =
        data.title;


    document.getElementById(
        "levelKhmer"
    ).textContent =
        data.khmer;


    const list =
        document.getElementById(
            "levelList"
        );


    list.innerHTML = "";


    data.courses.forEach(
        function(
            course,
            index
        ) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "level-button";


            button.textContent =
                course.level;


            button.onclick =
                function() {

                    showCourse(
                        index
                    );

                };


            list.appendChild(
                button
            );

        }
    );

}


// =======================================================
// SHOW COURSE DETAILS
// =======================================================

function showCourse(
    index
) {

    selectedCourse =
        courseData[
            selectedMajor
        ].courses[index];


    selectedCourse.remark =
        generateRemark();


    document.getElementById(
        "levelPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "detailsPage"
    ).classList.remove(
        "hidden"
    );


    renderCourse();

}


// =======================================================
// RENDER COURSE
// =======================================================

function renderCourse() {

    const course =
        selectedCourse;


    const details =
        document.getElementById(
            "courseDetails"
        );


    details.innerHTML = "";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "course-name";

    title.textContent =
        course.course;


    details.appendChild(
        title
    );


    const price =
        document.createElement(
            "div"
        );

    price.className =
        "price";


    price.innerHTML =
        '<span class="old-price">$' +
        course.oldPrice.toFixed(2) +
        '</span>' +

        '<span class="new-price">$' +
        course.price.toFixed(2) +
        '</span>';


    details.appendChild(
        price
    );


    const discount =
        document.createElement(
            "div"
        );

    discount.className =
        "discount";


    discount.innerHTML =
        "Save " +
        course.discount +
        "%" +

        "<br>" +

        "សន្សំបាន " +
        course.discount +
        "%";


    details.appendChild(
        discount
    );


    const remarkTitle =
        document.createElement(
            "div"
        );


    remarkTitle.className =
        "remark-title";


    remarkTitle.innerHTML =
        "Payment Remark" +

        "<br>" +

        "លេខសម្គាល់ការទូទាត់";


    details.appendChild(
        remarkTitle
    );


    const remark =
        document.createElement(
            "div"
        );


    remark.className =
        "remark";


    remark.textContent =
        course.remark;


    remark.id =
        "remarkText";


    details.appendChild(
        remark
    );


    const copy =
        document.createElement(
            "button"
        );


    copy.className =
        "copy-button";


    copy.innerHTML =
        "📋 Copy Remark" +

        "<br>" +

        "ចម្លងលេខសម្គាល់";


    copy.onclick =
        copyRemark;


    details.appendChild(
        copy
    );


    const important =
        document.createElement(
            "div"
        );


    important.className =
        "important";


    important.innerHTML =

        "⚠️ <strong>Important:</strong>" +

        "<br><br>" +

        "Copy this exact Payment Remark " +
        "and paste it into the " +
        "<strong>Remark</strong> field " +
        "when making your payment." +

        "<br><br>" +

        "សូមចម្លងលេខសម្គាល់ការទូទាត់នេះ " +
        "ហើយបិទភ្ជាប់វាទៅក្នុងប្រអប់ " +
        "<strong>Remark</strong> " +
        "នៅពេលធ្វើការទូទាត់។";


    details.appendChild(
        important
    );


    // ==============================================
    // THIS IS THE REGISTRATION BUTTON
    // ==============================================

    const register =
        document.createElement(
            "button"
        );


    register.className =
        "register-button";


    register.innerHTML =
        "✅ Continue Registration" +

        "<br>" +

        "បន្តការចុះឈ្មោះ";


    register.onclick =
        registerCourse;


    details.appendChild(
        register
    );

}


// =======================================================
// COPY REMARK
// =======================================================

function copyRemark() {

    if (
        !selectedCourse
    ) {
        return;
    }


    const remark =
        selectedCourse.remark;


    if (
        navigator.clipboard
    ) {

        navigator.clipboard
            .writeText(
                remark
            )
            .then(
                function() {

                    alert(
                        "Payment Remark copied: " +
                        remark
                    );

                }
            )
            .catch(
                function() {

                    alert(
                        "Payment Remark: " +
                        remark
                    );

                }
            );

    }
    else {

        alert(
            "Payment Remark: " +
            remark
        );

    }

}


// =======================================================
// REGISTER COURSE
// =======================================================

function registerCourse() {

    if (
        !selectedCourse
    ) {

        alert(
            "Please select a course first."
        );

        return;

    }


    const registration = {

        remark:
            selectedCourse.remark,

        course:
            selectedCourse.course,

        price:
            selectedCourse.price,

        discount:
            selectedCourse.discount,

        paymentLink:
            selectedCourse.paymentLink

    };


    console.log(
        "========== NEW REGISTRATION =========="
    );


    console.log(
        registration
    );


    console.log(
        "Remark:",
        registration.remark
    );


    console.log(
        "Course:",
        registration.course
    );


    console.log(
        "Price:",
        registration.price
    );


    console.log(
        "Discount:",
        registration.discount
    );


    console.log(
        "Payment Link:",
        registration.paymentLink
    );


    // ==============================================
    // SEND DATA TO TELEGRAM BOT
    // ==============================================

    try {

        tg.sendData(
            JSON.stringify(
                registration
            )
        );


        console.log(
            "✅ Registration sent to bot."
        );


    }
    catch (
        error
    ) {

        console.error(
            "❌ Registration error:",
            error
        );


        alert(
            "Registration could not be sent. " +
            "Please open the Mini App again."
        );

    }

}


// =======================================================
// HOME
// =======================================================

function showHome() {

    selectedMajor =
        null;

    selectedCourse =
        null;


    document.getElementById(
        "levelPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "detailsPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "homePage"
    ).classList.remove(
        "hidden"
    );

}


// =======================================================
// BACK TO LEVELS
// =======================================================

function backToLevels() {

    if (
        !selectedMajor
    ) {

        showHome();

        return;

    }


    document.getElementById(
        "detailsPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "levelPage"
    ).classList.remove(
        "hidden"
    );

}


</script>


</body>

</html>
